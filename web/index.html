<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEDNA CARE 院舍照護管理原型</title>
  <!-- 網頁字體為加分項，載入失敗會退到系統字體，不影響版面 -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- 背景三層：徑向柔光、點陣網格、顆粒噪聲 -->
  <div class="bg">
    <div class="bg-glow"></div>
    <div class="bg-grid"></div>
    <svg class="bg-grain" xmlns="http://www.w3.org/2000/svg">
      <filter id="grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
      </filter>
      <rect width="100%" height="100%" filter="url(#grain)"/>
    </svg>
  </div>

  <div id="root"></div>

  <script src="/api.js"></script>
  <script src="/motion.js"></script>
  <script src="/md.js"></script>
  <script src="/ui.js"></script>
  <script src="/orb.js"></script>
  <script src="/app.js"></script>
</body>
</html>
